<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #33ff33;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
  }
  .header {
    background: #111;
    border-bottom: 1px solid #1a3a1a;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-title {
    font-size: 13px;
    color: #ff8c00;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ticker-bar {
    display: flex;
    gap: 28px;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .ticker-item { white-space: nowrap; }
  .ticker-label { color: #888; }
  .ticker-value { color: #33ff33; font-weight: bold; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding: 24px;
  }
  .card {
    background: #111;
    border: 1px solid #1a3a1a;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .symbol {
    font-size: 16px;
    font-weight: bold;
    color: #fff;
  }
  .exchange {
    font-size: 11px;
    color: #555;
  }
  .price {
    font-size: 22px;
    font-weight: bold;
  }
  .change-row {
    display: flex;
    gap: 14px;
    font-size: 13px;
  }
  .up { color: #33ff33; }
  .down { color: #ff3333; }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #555;
    border-top: 1px solid #1a3a1a;
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Market Terminal</div>
  <div class="ticker-bar">
    <div class="ticker-item"><span class="ticker-label">Nifty 50: </span><span class="ticker-value">{{ "{:,.2f}".format(indices.nifty) }}</span></div>
    <div class="ticker-item"><span class="ticker-label">Bank Nifty: </span><span class="ticker-value">{{ "{:,.2f}".format(indices.banknifty) }}</span></div>
    <div class="ticker-item"><span class="ticker-label">Sensex: </span><span class="ticker-value">{{ "{:,.2f}".format(indices.sensex) }}</span></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const stocks = {{ stocks | tojson }};
const grid = document.getElementById("grid");

stocks.forEach(s => {
  const dir = s.change >= 0 ? "up" : "down";
  const sign = s.change >= 0 ? "+" : "";
  grid.innerHTML += `
    <div class="card">
      <div class="card-top">
        <span class="symbol">${s.symbol}</span>
        <span class="exchange">NSE</span>
      </div>
      <div class="price ${dir}">${s.price.toLocaleString("en-IN", { minimumFractionDigits: 2 })}</div>
      <div class="change-row">
        <span class="${dir}">${sign}${s.change.toFixed(2)}</span>
        <span class="${dir}">(${sign}${s.pct.toFixed(2)}%)</span>
      </div>
      <div class="meta">
        <span>H: ${s.high.toLocaleString("en-IN", { minimumFractionDigits: 2 })}</span>
        <span>L: ${s.low.toLocaleString("en-IN", { minimumFractionDigits: 2 })}</span>
        <span>Vol: ${s.vol}</span>
      </div>
    </div>`;
});
</script>

</body>
</html>
